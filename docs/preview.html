<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget preview</title>
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#F8FAFC;color:#0F172A}
  .hero{max-width:760px;margin:0 auto;padding:90px 24px;text-align:center}
  h1{font-size:34px;margin:0 0 12px}
  p{color:#64748B;max-width:520px;margin:0 auto}
  .tag{display:inline-block;margin-top:26px;background:#F1F5F9;color:#64748B;border-radius:999px;
    padding:6px 16px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
  <div class="hero">
    <h1>Widget preview</h1>
    <p>This page simulates a client website. The chat widget loads bottom-right exactly as it will on the real site.</p>
    <div class="tag" id="tag"></div>
  </div>
  <script>
    var slug = new URLSearchParams(location.search).get("client") || "";
    document.getElementById("tag").textContent = slug ? "client: " + slug : "add ?client=<slug> to the URL";
    if (slug) {
      var s = document.createElement("script");
      s.src = "https://fwynqfnrorhuixodnezs.supabase.co/functions/v1/support-widget?client=" + encodeURIComponent(slug);
      s.defer = true;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
